# Copy to secrets.yaml (gitignored), fill in the CHANGE_ME values, then:
#   kubectl apply -n <ns> -f secrets.yaml
# BEFORE `helm install`. All pods mount config.yaml; postgres reads postgres-password.
#
# This config.yaml is the *base override* (merged on top of the in-image default,
# under each pod's per-role overlay). It mainly supplies the DB + secrets; the
# message bus + services.disabled come from the chart's per-role ConfigMaps.
apiVersion: v1
kind: Secret
metadata:
  name: skyportal-secrets
type: Opaque
stringData:
  postgres-password: "CHANGE_ME_db_password"
  config.yaml: |
    database:
      database: skyportal
      host: skyportal-postgres        # the in-cluster postgres Service
      port: 5432
      user: skyportal
      password: "CHANGE_ME_db_password"   # must equal postgres-password above
    app:
      secret_key: "CHANGE_ME_random_secret"
      # production_tokens, factory keys, etc. as needed
    # Public URL + Google OAuth login (see README step 2). server.host must equal
    # ingress.host; ssl: True drives the https redirect_uri.
    server:
      protocol: https
      host: skyportal.example.com   # == ingress.host
      port: 443                      # the PUBLIC port — workers probe server.host:server.port/api/sysinfo
      ssl: True
      auth:
        debug_login: False
        google_oauth2_key: "CHANGE_ME_google_client_id"
        google_oauth2_secret: "CHANGE_ME_google_client_secret"
    # Slack / facility API overrides can also go here.
