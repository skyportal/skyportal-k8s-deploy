{{- /*
One Deployment per role (app / message-bus / workers). Same image + entrypoint
as Fritz; the per-role config overlay decides which services run. The bus binds
the #424 TCP ports; app exposes the HTTP/websocket port.
*/ -}}
{{- range $role, $cfg := .Values.roles }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skyportal.fullname" $ }}-{{ $role }}
  labels:
    {{- include "skyportal.labels" $ | nindent 4 }}
    skyportal.role: {{ $role }}
spec:
  replicas: {{ $cfg.replicas }}
  strategy:
    type: Recreate                # SkyPortal isn't built for rolling DB migrations
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "skyportal.name" $ }}
      skyportal.role: {{ $role }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "skyportal.name" $ }}
        skyportal.role: {{ $role }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") $ | sha256sum }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: config
          secret:
            secretName: {{ include "skyportal.fullname" $ }}-secrets
            items:
              - { key: config.yaml, path: config.yaml }
        - name: role-config
          configMap:
            name: {{ include "skyportal.fullname" $ }}-config-{{ $role }}
            items:
              - { key: role.yaml, path: role.yaml }
        {{- if ne $role "bus" }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "skyportal.fullname" $ }}-data
        {{- end }}
        {{- if and (eq $role "app") $.Values.observability.enabled }}
        - name: prometheus-config
          configMap:
            name: {{ include "skyportal.fullname" $ }}-prometheus-config
        - name: prometheus-token
          secret:
            secretName: {{ $.Values.observability.prometheus.tokenSecret }}
            items:
              - { key: skyportal_token, path: skyportal_token }
        - name: prometheus-data
          emptyDir: {}
        {{- end }}
      {{- if ne $role "bus" }}
      # cephfs subPaths are created root:root and fsGroup does not chown them, so uid-1000
      # pods can't write cutout/PNG thumbnails -> chown the data subdirs once, as root.
      initContainers:
        - name: fix-data-perms
          image: {{ include "skyportal.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - mkdir -p /data/thumbnails /data/persistentdata && chown {{ $.Values.podSecurityContext.fsGroup | default 1000 }}:{{ $.Values.podSecurityContext.fsGroup | default 1000 }} /data/thumbnails /data/persistentdata
          volumeMounts:
            - { name: data, mountPath: /data }
      {{- end }}
      containers:
        - name: skyportal
          image: {{ include "skyportal.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- if eq $role "app" }}
          ports:
            - { containerPort: {{ $.Values.service.appPort }}, name: app-port }
          {{- else if eq $role "bus" }}
          ports:
            - { containerPort: {{ $.Values.messageBus.receivePort }}, name: bus-recv }
            - { containerPort: {{ $.Values.messageBus.publishPort }}, name: bus-pub }
          {{- end }}
          env:
            - name: PYTHONPATH
              value: "."
            - name: FLAGS
              value: "--config=config.yaml --config=/etc/skyportal/config.yaml --config=/etc/skyportal/role.yaml"
          args:
            - /bin/bash
            - -c
            - |
              source .venv/bin/activate && \
              (make log &) && \
              baselayer/tools/env_summary.py ${FLAGS} && \
              make fill_conf_values && \
              make service_setup && \
              make run_production
          volumeMounts:
            - { name: config,      mountPath: /etc/skyportal/config.yaml, subPath: config.yaml, readOnly: true }
            - { name: role-config, mountPath: /etc/skyportal/role.yaml,   subPath: role.yaml,   readOnly: true }
            {{- if ne $role "bus" }}
            - { name: data, mountPath: /skyportal/persistentdata,      subPath: persistentdata }
            - { name: data, mountPath: /skyportal/static/thumbnails,   subPath: thumbnails }
            {{- end }}
          {{- if eq $role "app" }}
          # the app's migration + load can take minutes; a startupProbe gives it
          # room to come up before the liveness probe can kill it (it was flapping).
          # 100 x 15s = 25 min grace — covers a cold migration on a loaded DB.
          startupProbe:
            tcpSocket: { port: app-port }
            periodSeconds: 15
            failureThreshold: 100
          livenessProbe:
            tcpSocket: { port: app-port }
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /, port: app-port }
            initialDelaySeconds: 15
            periodSeconds: 10
          {{- end }}
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
        {{- if and (eq $role "app") $.Values.observability.enabled }}
        # Prometheus sidecar: shares the pod netns to scrape each worker's
        # localhost /api/internal/metrics (skyportal PR #6284).
        - name: prometheus
          image: {{ $.Values.observability.prometheus.image | quote }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ $.Values.observability.prometheus.retention }}
          ports:
            - { containerPort: 9090, name: prom }
          volumeMounts:
            - { name: prometheus-config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml, readOnly: true }
            - { name: prometheus-token,  mountPath: /etc/prometheus/token, readOnly: true }
            - { name: prometheus-data,   mountPath: /prometheus }
          resources:
            {{- toYaml $.Values.observability.prometheus.resources | nindent 12 }}
        {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
